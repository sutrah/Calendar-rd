name: Devoirs Pronote

on:
  schedule:
    # Heures Paris (CEST, UTC+2 en ce moment) : 12h, 15h, 16h, 17h, 19h.
    # GitHub Actions n'a pas de fuseau horaire : à ajuster de ±1h aux changements
    # d'heure d'été/hiver (dernier dimanche de mars/octobre) si besoin.
    - cron: '0 10 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Récupérer les devoirs Pronote et le calendrier hockey
        env:
          PRONOTE_URL: ${{ secrets.PRONOTE_URL }}
          PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
          PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}
          HOCKEY_ICS_URL_SOREN: ${{ secrets.HOCKEY_ICS_URL_SOREN }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/fetch_devoirs.py

      - name: Déployer les devoirs en FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster026.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./out/
          server-dir: /games/cal/data/
          dangerous-clean-slate: false
